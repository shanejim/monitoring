# prometheus-blackbox-exporter chart 11.17.2 / Blackbox Exporter v0.28.0
# Target: Docker Desktop Kubernetes arm64, namespace monitoring

fullnameOverride: prometheus-blackbox-exporter
replicas: 1

automountServiceAccountToken: false

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 9115

config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        follow_redirects: true
        preferred_ip_protocol: ip4
    tcp_connect:
      prober: tcp
      timeout: 10s

serviceMonitor:
  selfMonitor:
    enabled: true
    labels:
      release: monitoring-stack
      role: service-monitor
    interval: 30s
    scrapeTimeout: 10s

  enabled: true
  defaults:
    labels:
      release: monitoring-stack
      role: blackbox-probe
    interval: 30s
    scrapeTimeout: 10s
    honorTimestamps: true
    module: http_2xx
  targets:
    - name: prometheus-health
      url: http://monitoring-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090/-/healthy
      labels:
        release: monitoring-stack
        role: blackbox-probe
        target_group: monitoring
    - name: alertmanager-health
      url: http://monitoring-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093/-/healthy
      labels:
        release: monitoring-stack
        role: blackbox-probe
        target_group: monitoring
    - name: grafana-health
      url: http://monitoring-stack-grafana.monitoring.svc.cluster.local:80/api/health
      labels:
        release: monitoring-stack
        role: blackbox-probe
        target_group: monitoring

prometheusRule:
  enabled: true
  namespace: monitoring
  additionalLabels:
    release: monitoring-stack
    role: alert-rules
  rules:
    - alert: BlackboxProbeFailed
      expr: probe_success == 0
      for: 1m
      labels:
        severity: critical
        team: ops
      annotations:
        summary: "Blackbox 探测失败"
        description: >-
          目标 {{ $labels.instance }} 已连续 1 分钟探测失败，使用模块
          {{ $labels.module }}。

podSecurityContext:
  runAsNonRoot: true

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: false

# The exporter needs egress to every configured probe target. Keep the chart's
# NetworkPolicy disabled until the final target list is known.
networkPolicy:
  enabled: false

