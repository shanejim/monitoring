apiVersion: apps/v1
kind: Deployment
metadata:
  name: lark-alertmanager-adapter
  labels:
    app.kubernetes.io/name: lark-alertmanager-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lark-alertmanager-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lark-alertmanager-adapter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: lark-alertmanager-adapter:0.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
